<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'"
    />
    <title>Island</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="stage">
      <div id="notch" class="surface" data-state="idle" data-tab="home">
        <div class="layer" data-layer="idle">
          <div class="idlerow">
            <span class="orb" id="orb"><i class="orb-art" id="orbArt"></i></span>
            <span class="clock" id="clock">--:--</span>
            <span class="idlemeta" id="idleMeta"></span>
            <span class="wave" id="idleWave"><i></i><i></i><i></i><i></i></span>
            <span class="recdot" id="idleRec"></span>
          </div>
        </div>

        <div class="layer" data-layer="ambient">
          <div class="ambrow" id="ambMedia">
            <span class="art xs" id="ambArt"></span>
            <span class="marquee"><span class="marquee-in" id="ambText"></span></span>
            <span class="wave" id="ambWave"><i></i><i></i><i></i><i></i></span>
          </div>
          <div class="ambrow" id="ambTimer">
            <span class="tdot"></span>
            <span class="tlabel" id="ambTimerLabel"></span>
            <span class="tcount" id="ambTimerCount">0:00</span>
          </div>
          <div class="ambrow" id="ambToast">
            <span class="toastIcon" id="toastIcon">·</span>
            <span class="tlabel" id="toastText"></span>
          </div>
        </div>

        <div class="layer" data-layer="activity">
          <div class="la-glow" id="laGlow"></div>
          <div class="la-row">
            <span class="la-art" id="laArt"></span>
            <span class="la-meta">
              <span class="la-title" id="laTitle"></span>
              <span class="la-sub" id="laSub"></span>
              <span class="la-bar"><i id="laFill"></i></span>
              <span class="la-times">
                <span id="laElapsed">0:00</span>
                <span id="laRemain"></span>
              </span>
            </span>
            <span class="la-side">
              <span class="la-badge" id="laBadge"><img id="laBadgeImg" alt="" /></span>
              <span class="wave playing la-wave"><i></i><i></i><i></i><i></i></span>
            </span>
          </div>
        </div>

        <div class="layer" data-layer="expanded">
          <nav id="nav">
            <div class="tabs" id="tabs"></div>
            <span class="grow"></span>
            <button class="navbtn" id="btnPin" title="Keep open">
              <svg viewBox="0 0 24 24" width="13" height="13"><path d="M12 3v8m0 0-3-3m3 3 3-3M5 17h14M5 21h14"/></svg>
            </button>
            <button class="navbtn" id="btnMenu" title="Menu">
              <svg viewBox="0 0 24 24" width="13" height="13"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6v3M12 18.4v3M2.6 12h3M18.4 12h3M5.4 5.4l2.1 2.1M16.5 16.5l2.1 2.1M18.6 5.4l-2.1 2.1M7.5 16.5l-2.1 2.1"/></svg>
            </button>
          </nav>
          <div id="panes"></div>
        </div>
      </div>

      <div id="menu" class="surface">
        <div class="mn-sliders">
          <div class="mn-row">
            <button class="mn-icon" id="mnMute" title="Mute">
              <svg viewBox="0 0 24 24" width="15" height="15"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="w1" d="M16.5 8.5a5 5 0 0 1 0 7"/><path class="w2" d="M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M17 9.5l5 5m0-5l-5 5"/></svg>
            </button>
            <span class="mn-track" id="mnVolTrack"><i id="mnVolFill"></i></span>
            <span class="mn-val" id="mnVolVal">—</span>
          </div>
          <div class="mn-row" id="mnBriRow">
            <span class="mn-icon mn-sun">
              <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.9 1.9M16.8 16.8l1.9 1.9M18.7 5.3l-1.9 1.9M7.2 16.8l-1.9 1.9"/></svg>
            </span>
            <span class="mn-track" id="mnBriTrack"><i id="mnBriFill"></i></span>
            <span class="mn-val" id="mnBriVal">—</span>
          </div>
          <div class="mn-note" id="mnBriNote"></div>
        </div>

        <div class="mn-div"></div>
        <button class="mn-item" id="mnAutostart"><span class="mn-check"></span><span>Start at login</span></button>
        <button class="mn-item" id="mnClipPause"><span class="mn-check"></span><span>Pause clipboard capture</span></button>

        <div class="mn-div"></div>
        <button class="mn-item" id="mnHide"><span class="mn-check off"></span><span>Hide panel</span></button>
        <button class="mn-item" id="mnReload"><span class="mn-check off"></span><span>Reload</span></button>
        <button class="mn-item mn-danger" id="mnQuit"><span class="mn-check off"></span><span>Quit</span></button>
      </div>
    </div>

    <script src="core.js"></script>
    <script src="tabs/home.js"></script>
    <script src="tabs/tray.js"></script>
    <script src="tabs/stats.js"></script>
    <script src="tabs/weather.js"></script>
    <script src="tabs/alerts.js"></script>
    <script src="tabs/board.js"></script>
    <script src="tabs/tools.js"></script>
    <script src="tabs/more.js"></script>
    <script src="boot.js"></script>
  </body>
</html>
